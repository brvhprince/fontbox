name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.15.8'

jobs:
  lint_typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Turbo CLI
        run: pnpm install --global turbo

      - name: Run linting
        run: pnpm lint

      - name: Run type checks
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint_typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Turbo CLI
        run: pnpm install --global turbo

      - name: Build packages
        run: pnpm build

  tests:
    name: Unit & Playwright tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fontbox
          POSTGRES_PASSWORD: fontbox
          POSTGRES_DB: fontbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fontbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          # Cache the browser binaries downloaded by Playwright to avoid re-downloading.
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Restore Prisma client cache
        uses: actions/cache@v4
        with:
          # Persist generated Prisma client artifacts between runs for faster setup.
          path: |
            apps/api/node_modules/.prisma
            node_modules/.prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('pnpm-lock.yaml', 'apps/api/prisma/schema.prisma') }}
          restore-keys: ${{ runner.os }}-prisma-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Turbo CLI
        run: pnpm install --global turbo

      - name: Install Playwright browsers
        run: pnpm dlx playwright install --with-deps

      - name: Generate Prisma client
        run: pnpm --filter api prisma generate

      - name: Prepare storage mount
        run: sudo mkdir -p /storage && sudo chmod 777 /storage

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://fontbox:fontbox@localhost:5432/fontbox
          REDIS_URL: redis://localhost:6379
          STORAGE_DIR: storage
        run: pnpm test

      - name: Run Playwright tests
        env:
          DATABASE_URL: postgresql://fontbox:fontbox@localhost:5432/fontbox
          REDIS_URL: redis://localhost:6379
          STORAGE_DIR: storage
        run: pnpm dlx playwright test
